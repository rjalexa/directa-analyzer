name: Check and deploy Vite app

on:
  push:
    branches:
      - main    # deploy whenever you push here
  pull_request:
    branches:
      - main    # lint and build PRs, but never deploy them

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # required by actions-gh-pages

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10   # match the pnpm that writes pnpm-lock.yaml locally

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages
        if: github.event_name == 'push'   # PRs stop after lint + build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

